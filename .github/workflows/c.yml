name: C CI

on:
  push:
    branches: [ "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential libpcre2-dev \
            libsdl2-dev \
            gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64 zstd

      - name: Build and install pcre2 from source (static) 
        run: | 
          git clone https://github.com/PCRE2Project/pcre2.git
          cd pcre2
          git checkout pcre2-10.47
          mkdir build && cd build
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/x86_64-w64-mingw32 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_STATIC_LIBS=ON \
            -DPCRE2_STATIC_PIC=ON \
            -DPCRE2_BUILD_PCRE2GREP=OFF \
            -DPCRE2_BUILD_TESTS=OFF
          cmake --build . --config Release
          sudo cmake --install .

      - name: Build and install SDL2 from source for MinGW
        run: |
          git clone https://github.com/libsdl-org/SDL.git
          cd SDL
          git checkout release-2.30.6
          mkdir build-mingw && cd build-mingw
          cmake .. \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_FIND_ROOT_PATH=/usr/x86_64-w64-mingw32 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/x86_64-w64-mingw32 \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build . --config Release
          sudo cmake --install .

      - name: Build Linux
        run: make linux

      - name: Build Windows
        run: make windows

      - name: Verify static linking 
        run: | 
          echo "=== Linux binary ===" 
          ldd build/regexsearcher 2>&1 || echo "(statically linked — ldd reports no dynamic dependencies)" 
          echo "=== Windows binary ===" 
          x86_64-w64-mingw32-objdump -p build/regexsearcher.exe | grep "DLL Name" || echo "(no DLL dependencies found)"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            build/regexsearcher
            build/regexsearcher.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/regexsearcher
            build/regexsearcher.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
